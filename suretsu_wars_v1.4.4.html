            score: metric
          };
        }
      }
    }

    return bestHighScorePlan;
  }

  function findBestDestroyPlanForCpu(isEasy, isHard) {
    if (itemUsed[2].bomb || scores[2] < ITEM_COSTS.bomb) return null;

    var goal = getGoalValue();
    var cpuRem = goal - scores[2];
    var p1Rem = goal - scores[1];
    var isLongGoal = goal >= 300;
    var boardTiles = getBoardTiles();
    if (boardTiles.length === 0) return null;

    if (isHard) {
      var highScorePlan = evaluateHighScoreDestroyCandidatesHard(goal);
      if (highScorePlan) {
        return highScorePlan;
      }
    }

    if (isEasy) {
      if (scores[2] < ITEM_COSTS.bomb + 55 || scores[2] <= scores[1] + 30) return null;
      var bestEasy = null;
      var bestEasyScore = 0;
      for (var eIdx = 0; eIdx < boardTiles.length; eIdx++) {
        var et = boardTiles[eIdx];
        if (et.tile.owner === 2) continue;
        var eLinks = countConnectedLinksForTile(et.r, et.c, et.tile, [1, 0, 2]);
        var eScore = eLinks * 14 + (et.tile.owner === 0 ? 10 : 8) + (luckyMap[et.r][et.c] ? 8 : 0);
        if (eScore >= 36 && eScore > bestEasyScore) {
          bestEasyScore = eScore;
          bestEasy = {
            r: et.r,
            c: et.c,
            selfRebuild: false,
            threatReduction: eLinks * 10,
            score: eScore
          };
        }
      }
      return bestEasy;
    }

    var baselineThreat = 0;
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        if (board[r][c] === null) {
          var th = getMaxPlayerThreatAtCell(r, c, isHard);
          if (th > baselineThreat) baselineThreat = th;
        }
      }
    }

    var bestTarget = null;
    var bestDestroyScore = 0;

    for (var i = 0; i < boardTiles.length; i++) {
      var bt = boardTiles[i];

      if (bt.tile.owner === 2) {
        if (!isHard) continue;
        var ownLinks = countConnectedLinksForTile(bt.r, bt.c, bt.tile, [0, 1, 2]);
        if (ownLinks < 2) continue;
        if (!canHandPlaceDirectlyAt(bt.r, bt.c, 2)) continue;

        var savedOwn = board[bt.r][bt.c];
        board[bt.r][bt.c] = null;
        var bestRebuildPts = 0;
        var bestRebuildVal = -999999;
        var bestOwnRebuildMove = null;

        for (var hh = 0; hh < hands[2].length; hh++) {
          var hTile = hands[2][hh];
          var hMoves = getValidMoves(hTile, 2);
          for (var mm = 0; mm < hMoves.length; mm++) {
            if (hMoves[mm].penalty) continue;
            var testLegs = hTile.legs.slice();
            for (var rot = 0; rot < 4; rot++) {
              var cand = scoreSingleCandidate(hTile, hh, hMoves[mm], testLegs, 2, false);
              if (cand.points > bestRebuildPts || (cand.points === bestRebuildPts && cand.val > bestRebuildVal)) {
                bestRebuildPts = cand.points;
                bestRebuildVal = cand.val;
                bestOwnRebuildMove = cand;
              }
              testLegs = rotateLegsCW(testLegs);
            }
          }
        }
        board[bt.r][bt.c] = savedOwn;

        if (!bestOwnRebuildMove || bestOwnRebuildMove.penalty) continue;
        var ownNetAfterCost = bestRebuildPts - ITEM_COSTS.bomb;
        var canReachGoalByRebuild = ((scores[2] - ITEM_COSTS.bomb + bestRebuildPts) >= goal && bestRebuildPts > ITEM_COSTS.bomb);
        var isBig95PlusCombo = (bestRebuildPts >= 95 && ownNetAfterCost >= 55);
        if ((isBig95PlusCombo || canReachGoalByRebuild) && bestRebuildVal > bestDestroyScore) {
          bestDestroyScore = bestRebuildVal;
          bestTarget = {
            r: bt.r,
            c: bt.c,
            selfRebuild: true,
            rebuildPts: bestRebuildPts,
            netAfterCost: ownNetAfterCost,
            plannedMove: bestOwnRebuildMove,
            threatReduction: 0,
            score: bestRebuildVal
          };
        }
        continue;
      }

      if (isHard && isLongGoal && cpuRem > 180 && p1Rem > 140 && scores[2] < 95) {
        continue;
      }

      var p1ConnectedLinks = countConnectedLinksForTile(bt.r, bt.c, bt.tile, [1, 0]);
      if (bt.tile.owner === 1 && p1ConnectedLinks === 0 && !luckyMap[bt.r][bt.c]) continue;

      var savedCell = board[bt.r][bt.c];
      board[bt.r][bt.c] = null;

      var newMaxThreat = 0;
      for (var rr = 0; rr < ROWS; rr++) {
        for (var cc = 0; cc < COLS; cc++) {
          if (board[rr][cc] === null) {
            var th2 = getMaxPlayerThreatAtCell(rr, cc, isHard);
            if (th2 > newMaxThreat) newMaxThreat = th2;
          }
        }
      }

      board[bt.r][bt.c] = savedCell;

      var threatReduction = baselineThreat - newMaxThreat;
      var destroyVal = threatReduction * 1.25 + p1ConnectedLinks * 13;
      if (bt.tile.wild) destroyVal += 18;
      else if (bt.tile.owner === 0) destroyVal += 9;
      if (luckyMap[bt.r][bt.c]) destroyVal += 9;
      if (p1Rem <= 60) destroyVal += 18;

      var minThreatDrop = isHard ? 45 : 30;
      var minBaseThreat = isHard ? 60 : 50;
      var minDestroyVal = isHard ? (isLongGoal ? 68 : 58) : 45;
      if ((threatReduction >= minThreatDrop || (baselineThreat >= minBaseThreat && destroyVal >= minDestroyVal)) && destroyVal > bestDestroyScore) {
        bestDestroyScore = destroyVal;
        bestTarget = {
          r: bt.r,
          c: bt.c,
          selfRebuild: false,
          threatReduction: threatReduction,
          score: destroyVal
        };
      }
    }

    return bestTarget;
  }

  function scoreSingleCandidate(baseTile, h, m, testLegs, player, isEasy) {
    var isHard = (player === 2 && cpuDifficulty === "hard");
    var testTile = {
      num: baseTile.num,
      owner: baseTile.owner,
      wild: !!baseTile.wild,
      legs: testLegs.slice()
    };
    board[m.r][m.c] = { tile: testTile };
    var res = evaluateScoreCached(m.r, m.c, player);
    var conn = analyzeSelfConnection(m.r, m.c, testTile, player);
    board[m.r][m.c] = null;

    var enemyThreat = estimateThreatToPlayer(m.r, m.c, testTile, player);
    var isSelfTile = testTile.owner === player;

    var trapCaution = 0;
    if (cpuKnowsP1Trap && res.rawGain >= 30) {
      trapCaution = isEasy ? 1 : (isHard ? 7 : 4);
    }

    var rouletteAdjust = 0;
    if (rouletteMap[m.r][m.c]) {
      var chaosProb = 0.30;
      var chaosRisk = chaosProb * (res.rawGain + 22);
      if (res.rawGain >= 20 || scores[2] > scores[1]) {
        rouletteAdjust = -chaosRisk;
      } else {
        rouletteAdjust = 3;
      }
    }

    var goal = getGoalValue();
    var canReachGoalNow = (player === 2 && (scores[2] + res.points) >= goal);
    var p1CanReachGoalNext = (enemyThreat > 0 && (scores[1] + enemyThreat) >= goal);

    var val;
    if (isEasy) {
      val = res.points * 1.15
        + conn.synergy * 0.65
        + rouletteAdjust * 0.5
        - enemyThreat * 0.45
        - trapCaution
        - (m.penalty ? 80 : 0)
        + Math.random() * 6;
      if (isSelfTile) {
        if (conn.connectedToAlly) val += 14;
        else if (conn.openFutureLinks > 0) val += 6;
        else val -= 90;
      }
    } else if (isHard) {
      var hardBlockBonus = conn.blockEnemyCount * 15 + conn.stealRainbowBonus;
      var finishBonus = canReachGoalNow ? 500 : 0;
      var antiFinishPenalty = p1CanReachGoalNext ? (enemyThreat * 1.4) : 0;

      val = res.points * 1.55
        + conn.synergy * 1.2
        + hardBlockBonus
        + rouletteAdjust
        + finishBonus
        - enemyThreat * 0.95
        - antiFinishPenalty
        - trapCaution
        - (m.penalty ? 95 : 0)
        + (minusMap[m.r][m.c] && !res.hasYaku && !res.trapHit ? 7 : 0)
        + Math.random() * 0.5;

      if (isSelfTile) {
        if (conn.connectedToAlly) val += 28;
        else if (conn.openFutureLinks > 0) val += 13;
        else val -= 135;
      }
    } else {
      val = res.points * 1.4
        + conn.synergy
        + rouletteAdjust
        - enemyThreat * 0.45
        - trapCaution
        - (m.penalty ? 80 : 0)
        + (minusMap[m.r][m.c] && !res.hasYaku && !res.trapHit ? 6 : 0)
        + Math.random() * 2;

      if (isSelfTile) {
        if (conn.connectedToAlly) val += 25;
        else if (conn.openFutureLinks > 0) val += 12;
        else val -= 120;
      }
    }

    return {
      r: m.r,
      c: m.c,
      h: h,
      penalty: m.penalty,
      tile: testTile,
      points: res.points,
      val: val,
      isValidSelfOrRainbow: (!isSelfTile) || conn.hasAnyLinkPotential
    };
  }

  function evaluateCandidatesChunked(player, onDone, skipCache) {
    var tasks = buildCandidateTasksForCpu(player);
    var isEasy = (player === 2 && cpuDifficulty === "easy");
    var isNormal = (player === 2 && cpuDifficulty === "normal");
    var curBoardSig = (!skipCache && player === 2) ? getBoardSignatureForCpu() : null;

    var list = [];
    var cursor = 0;
    var chunkSize = isNormal ? 14 : 10;

    function step() {
      if (gameOver || !stageConfirmed) return;
      var end = Math.min(cursor + chunkSize, tasks.length);
      for (; cursor < end; cursor++) {
        var tk = tasks[cursor];
        if (curBoardSig) {
          var candKey = cpuDifficulty + "|T" + turnCount[2] + "|" + curBoardSig + "|" + tk.m.r + "," + tk.m.c + "|" + tk.baseTile.owner + ":" + (tk.baseTile.wild ? "W" : tk.baseTile.num) + ":" + tk.legs.join("");
          if (cpuCandidateCache.hasOwnProperty(candKey)) {
            var cached = cpuCandidateCache[candKey];
            list.push({
              r: cached.r,
              c: cached.c,
              h: tk.h,
              penalty: tk.m.penalty,
              tile: cached.tile,
              points: cached.points,
              val: cached.val,
              isValidSelfOrRainbow: cached.isValidSelfOrRainbow
            });
            continue;
          }
          var computed = scoreSingleCandidate(tk.baseTile, tk.h, tk.m, tk.legs, player, isEasy);
          cpuCandidateCache[candKey] = computed;
          list.push(computed);
        } else {
          list.push(scoreSingleCandidate(tk.baseTile, tk.h, tk.m, tk.legs, player, isEasy));
        }
      }
      if (cursor < tasks.length) {
        setTimeout(step, 0);
      } else {
        onDone(list);
      }
    }

    step();
  }

  function pickBestFromCandidates(allCandidates) {
    var preferredCandidates = allCandidates.filter(function(cand) {
      return cand.isValidSelfOrRainbow;
    });
    var pool = preferredCandidates.length > 0 ? preferredCandidates : allCandidates;
    var bestMove = null;
    var bestVal = -999999;
    for (var p = 0; p < pool.length; p++) {
      if (pool[p].val > bestVal) {
        bestVal = pool[p].val;
        bestMove = pool[p];
      }
    }
    return bestMove;
  }

  function isTilePromisingForRotation(bt, isHard) {
    var hasEmptyAdj = false;
    var hasCompatibleAdj = false;
    for (var d = 0; d < 4; d++) {
      var nr = bt.r + DR[d], nc = bt.c + DC[d];
      if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
      var cell = board[nr][nc];
      if (cell === null) {
        hasEmptyAdj = true;
      } else if (cell && cell.tile) {
        var at = cell.tile;
        if (at.owner === 0 || at.owner === 2 || bt.tile.owner === 0 || bt.tile.owner === 2) {
          hasCompatibleAdj = true;
        } else if (bt.tile.wild || at.wild || Math.abs(bt.tile.num - at.num) <= 1) {
          hasCompatibleAdj = true;
        }
      }
    }
    if (!hasEmptyAdj) return false;
    return isHard ? true : hasCompatibleAdj;
  }

  function findBestRotatePiecePlanChunked(isHard, baselinePoints, baselineVal, onDone, skipForTimeBudget) {
    if (skipForTimeBudget || itemUsed[2].rot || scores[2] < ITEM_COSTS.rot) {
      onDone(null);
      return;
    }

    var boardTiles = getBoardTiles();
    if (boardTiles.length === 0) {
      onDone(null);
      return;
    }

    var promisingTiles = boardTiles.filter(function(bt) {
      return isTilePromisingForRotation(bt, isHard);
    });
    var searchTargets = promisingTiles.length > 0 ? promisingTiles : [];
    if (searchTargets.length === 0) {
      onDone(null);
      return;
    }
    if (!isHard && searchTargets.length > 6) {
      searchTargets = searchTargets.slice(0, 6);
    } else if (isHard && searchTargets.length > 8) {
      searchTargets = searchTargets.slice(0, 8);
    }

    var bestPlan = null;
    var bestNetScore = 0;
    var minPointGain = isHard ? 10 : 25;
    var minNetAdvantage = isHard ? -8 : 5;
    var minValGain = isHard ? 12 : 18;
    var minBestPoints = isHard ? 10 : 30;

    var idx = 0;

    function nextTarget() {
      if (gameOver || !stageConfirmed) return;
      if (idx >= searchTargets.length) {
        onDone(bestPlan);
        return;
      }

      var target = searchTargets[idx++];
      var origLegs = target.tile.legs.slice();
      var rotStates = [];
      var curL = origLegs.slice();
      for (var st = 1; st <= 3; st++) {
        curL = rotateLegsCW(curL);
        if (!areLegsEqual(curL, origLegs)) {
          rotStates.push({ steps: st, legs: curL.slice() });
        }
      }

      var sIdx = 0;
      function nextRotState() {
        if (gameOver || !stageConfirmed) return;
        if (sIdx >= rotStates.length) {
          setTimeout(nextTarget, 0);
          return;
        }
        var rState = rotStates[sIdx++];
        target.tile.legs = rState.legs;

        evaluateCandidatesChunked(2, function(rotCandidates) {
          target.tile.legs = origLegs;
          var bestWithRot = pickBestFromCandidates(rotCandidates);

          if (bestWithRot) {
            var pointGain = bestWithRot.points - baselinePoints;
            var valGain = bestWithRot.val - baselineVal;
            var netAdvantage = pointGain - ITEM_COSTS.rot;

            var hardDisruptRotate = isHard && (valGain >= 22 && bestWithRot.val > baselineVal + 16);
            var normalScoreRotate = (pointGain >= minPointGain && netAdvantage >= minNetAdvantage && valGain > minValGain && bestWithRot.points >= minBestPoints);

            if (normalScoreRotate || hardDisruptRotate) {
              var planScore = isHard ? (bestWithRot.points + valGain * 0.72 + pointGain * 0.35) : (bestWithRot.points + valGain * 0.25);
              if (!bestPlan || planScore > bestNetScore) {
                bestNetScore = planScore;
                bestPlan = {
                  rotR: target.r,
                  rotC: target.c,
                  rotDeg: rState.steps * 90,
                  nextLegs: rState.legs,
                  legsChanged: !areLegsEqual(origLegs, rState.legs),
                  move: bestWithRot,
                  pointGain: pointGain
                };
              }
            }
          }

          setTimeout(nextRotState, 0);
        }, true);
      }

      nextRotState();
    }

    nextTarget();
  }

  function hasWeakHandForCpu() {
    var totalLinks = 0;
    for (var h = 0; h < hands[2].length; h++) {
      var t = hands[2][h];
      if (t.wild || t.owner === 0) totalLinks += 2;
      var legSum = 0;
      for (var d = 0; d < 4; d++) if (t.legs[d]) legSum++;
      totalLinks += legSum;
    }
    return totalLinks <= 7;
  }

  function finishCpuTurnWithMove(bestMove, didRotateForPlan, didDestroyForPlan, isEasy, isHard) {
    var goal = getGoalValue();
    var p1Rem = goal - scores[1];
    var reachesGoalNow = !!(bestMove && (scores[2] + bestMove.points) >= goal);

    if (!isEasy && !didRotateForPlan && !didDestroyForPlan && !reachesGoalNow && !itemUsed[2].trap && scores[2] >= ITEM_COSTS.trap && bestMove) {
      var trapAllowed = isEasy
        ? (bestMove.points < 35 && Math.random() < 0.65)
        : (isHard ? (bestMove.points < 55 || p1Rem <= 60) : (bestMove.points < 35));

      if (trapAllowed) {
        var trapCandidates = getFocusedTrapCandidatesForCpu(isEasy, isHard);
        if (trapCandidates.length > 0) {
          var bestTrap = null;
          var bestTrapScore = -999;
          for (var tcIdx = 0; tcIdx < trapCandidates.length; tcIdx++) {
            var candPos = trapCandidates[tcIdx];
            if (candPos[0] === bestMove.r && candPos[1] === bestMove.c) continue;
            var sc = scoreTrapCandidateForCpu(candPos[0], candPos[1], isHard);
            if (sc > bestTrapScore) {
              bestTrapScore = sc;
              bestTrap = candPos;
            }
          }
          var minTrapThreshold = isEasy ? 10 : (isHard ? (p1Rem <= 60 ? 18 : 22) : 14);
          if (bestTrap && bestTrapScore >= minTrapThreshold) {
            itemUsed[2].trap = true;
            scores[2] -= ITEM_COSTS.trap;
            trapMap[bestTrap[0]][bestTrap[1]] = 2;
            cpuUsedTrapLastTurn = true;
            playSeTrapArm();
            triggerCellClass(bestTrap[0], bestTrap[1], "fx-trap-lock", 520);
            addLog("CPU" + (isHard ? " [HARD]" : (isEasy ? " [EASY]" : "")) + ": TRAP (-" + ITEM_COSTS.trap + " pt)", "#f87171");
          }
        }
      }
    }

    if (bestMove) {
      finalizeMove(bestMove.r, bestMove.c, bestMove.h, bestMove.tile, 2, bestMove.penalty);
    }
  }

  function cpuTurn() {
    if (gameOver || !stageConfirmed) return;
    stopCpuBackgroundPrecompute();
    cpuLastActions = { place: null, rotate: null, destroy: null };
    cpuUsedTrapLastTurn = false;

    var isEasy = (cpuDifficulty === "easy");
    var isHard = (cpuDifficulty === "hard");
    var didDestroyForPlan = false;

    var plannedDestroyMove = null;
    if (!isEasy && !itemUsed[2].bomb && scores[2] >= ITEM_COSTS.bomb) {
      var destroyTarget = findBestDestroyPlanForCpu(isEasy, isHard);
      if (destroyTarget && board[destroyTarget.r][destroyTarget.c] && board[destroyTarget.r][destroyTarget.c].tile) {
        itemUsed[2].bomb = true;
        scores[2] -= ITEM_COSTS.bomb;
        board[destroyTarget.r][destroyTarget.c] = null;
        cpuLastActions.destroy = [destroyTarget.r, destroyTarget.c];
        didDestroyForPlan = true;
        plannedDestroyMove = destroyTarget.plannedMove || null;
        cpuCandidateCache = {};
        playSeDestroyBlast();
        addLog("CPU" + (isHard ? " [HARD]" : (isEasy ? " [EASY]" : "")) + ": DESTROY (-" + ITEM_COSTS.bomb + " pt" + (destroyTarget.highScoreDestroy ? (" / HIGH SCORE [" + destroyTarget.targetOwnerLabel + "] +" + destroyTarget.rebuildPts + "pt (net +" + destroyTarget.netAfterCost + "pt)") : (destroyTarget.selfRebuild ? " / SELF REBUILD" : " / Threat -" + destroyTarget.threatReduction)) + ")", "#f87171");
        updateUI();
        spawnDestroyBlast(destroyTarget.r, destroyTarget.c);
      }
    }

    if (plannedDestroyMove) {
      setTimeout(function() {
        if (!gameOver && stageConfirmed) {
          finishCpuTurnWithMove(plannedDestroyMove, false, true, isEasy, isHard);
        }
      }, 140);
      return;
    }

    if (!isEasy && !didDestroyForPlan && !itemUsed[2].shf && scores[2] >= ITEM_COSTS.shf) {
      var shouldShuffle = false;
      if (isHard) {
        shouldShuffle = hasWeakHandForCpu();
      } else if (isEasy) {
        shouldShuffle = hasWeakHandForCpu() && Math.random() < 0.35;
      } else {
        shouldShuffle = hasWeakHandForCpu() || (scores[2] >= ITEM_COSTS.shf + 15 && Math.random() < 0.30);
      }
      if (shouldShuffle) {
        itemUsed[2].shf = true;
        scores[2] -= ITEM_COSTS.shf;
        hands[2] = [createRandomTile(2), createRandomTile(2), createRandomTile(2), createRandomTile(2)];
        playSeShuffle();
        addLog("CPU" + (isHard ? " [HARD]" : (isEasy ? " [EASY]" : "")) + ": SHUFFLE HAND (-" + ITEM_COSTS.shf + " pt)", "#f87171");
      }
    }

    evaluateCandidatesChunked(2, function(baseCandidates) {
      var bestBase = pickBestFromCandidates(baseCandidates);
      var baselinePoints = bestBase ? bestBase.points : 0;
      var baselineVal = bestBase ? bestBase.val : -999999;

      var skipRotateForBudget = isEasy || (didDestroyForPlan && (scores[2] < 50 || getBoardTiles().length > 10));

      findBestRotatePiecePlanChunked(isHard, baselinePoints, baselineVal, function(rotPlan) {
        if (rotPlan && board[rotPlan.rotR][rotPlan.rotC] && board[rotPlan.rotR][rotPlan.rotC].tile) {
          itemUsed[2].rot = true;
          scores[2] -= ITEM_COSTS.rot;
          board[rotPlan.rotR][rotPlan.rotC].tile.legs = rotPlan.nextLegs;
          cpuLastActions.rotate = [rotPlan.rotR, rotPlan.rotC];
          playSeRotate();
          triggerCellClass(rotPlan.rotR, rotPlan.rotC, "fx-piece-spin", 380);
          addLog("CPU" + (isHard ? " [HARD]" : (isEasy ? " [EASY]" : "")) + ": ROTATE PIECE " + rotPlan.rotDeg + "° (-" + ITEM_COSTS.rot + " pt / +" + rotPlan.pointGain + " pt swing)", "#f87171");
          finishCpuTurnWithMove(rotPlan.move, true, didDestroyForPlan, isEasy, isHard);
        } else {
          finishCpuTurnWithMove(bestBase, false, didDestroyForPlan, isEasy, isHard);
        }
      }, skipRotateForBudget);
    }, false);
  }

  function selectItem(type) {
    if (!stageConfirmed || gameOver || turnPlayer !== 1 || draftMove || rotDraft) return;
    if (itemUsed[1][type]) {
      setStatus("This item has already been used in this match.");
      return;
    }
    if (activeItem === type) {
      playSeSelect();
      activeItem = null;
      playerInteractedThisTurn = false;
      setStatus("Select a tile, place it, click to rotate, then click CONFIRM.");
      updateUI();
      return;
    }
    var cost = ITEM_COSTS[type];
    if (scores[1] < cost) { setStatus("Not enough points!"); return; }

    if (type === "shf") {
      itemUsed[1].shf = true;
      scores[1] -= cost;
      hands[1] = [createRandomTile(1), createRandomTile(1), createRandomTile(1), createRandomTile(1)];
      selectedHandIdx = 0;
      playerInteractedThisTurn = true;
      playSeShuffle();
      addLog("P1: SHUFFLE HAND (-" + cost + " pt)", "#fbbf24");
      updateUI(); return;
    }
    if (type === "rot") {
      if (getBoardTiles().length === 0) {
        setStatus("No placed tile on the board to rotate.");
        return;
      }
      playSeSelect();
      activeItem = "rot";
      playerInteractedThisTurn = true;
      setStatus("Click any placed tile to rotate freely, then click CONFIRM.");
      updateUI(); return;
    }
    if (type === "trap") {
      var validTraps = getValidTrapCells();
      if (validTraps.length === 0) {
        setStatus("No valid empty cell for TRAP.");
        return;
      }
    }
    if (type === "bomb") {
      if (getBoardTiles().length === 0) {
        setStatus("No placed tile on the board to DESTROY.");
        return;
      }
    }
    playSeSelect();
    activeItem = type;
    playerInteractedThisTurn = true;
    setStatus(type === "trap" ? "Click any empty cell (including special cells) to set TRAP" : "Click a tile to DESTROY");
    updateUI();
  }

  function onCellClick(r, c) {
    if (!stageConfirmed || gameOver || turnPlayer !== 1) return;

    if (rotDraft && !rotDraft.committed) {
      if (rotDraft.r === r && rotDraft.c === c) {
        stopCpuBackgroundPrecompute();
        board[r][c].tile.legs = rotateLegsCW(board[r][c].tile.legs);
        rotDraft.rotCount = (rotDraft.rotCount + 1) % 4;
        playSeRotate();
        var degNow = rotDraft.rotCount * 90;
        setStatus(degNow === 0
          ? "Back to 0°. Click tile to rotate, or select a hand tile & cell."
          : ("Rotated " + degNow + "°. Click tile again, or select a hand tile & cell, then CONFIRM."));
        updateUI();
        return;
      }
    }

    if (draftMove) {
      if (draftMove.r === r && draftMove.c === c) {
        draftMove.tile.legs = rotateLegsCW(draftMove.tile.legs);
        playSeRotate();
        setStatus("Click tile to rotate 90°, or click CONFIRM to finish turn.");
        updateUI();
      }
      return;
    }

    if (activeItem === "rot") {
      if (!itemUsed[1].rot && board[r][c] && board[r][c].tile) {
        stopCpuBackgroundPrecompute();
        var origLegs = board[r][c].tile.legs.slice();
        board[r][c].tile.legs = rotateLegsCW(origLegs);
        rotDraft = {
          r: r,
          c: c,
          origLegs: origLegs,
          rotCount: 1
        };
        playSeRotate();
        setStatus("Rotated 90°. Click same tile to rotate further, or click CONFIRM / CANCEL.");
        updateUI();
      }
      return;
    }
    if (activeItem === "trap") {
      if (!itemUsed[1].trap && canSetTrapAt(r, c)) {
        var costTrap = ITEM_COSTS.trap;
        itemUsed[1].trap = true;
        scores[1] -= costTrap; trapMap[r][c] = 1; activeItem = null;
        cpuKnowsP1Trap = true;
        playSeTrapArm();
        addLog("P1: TRAP (-" + costTrap + " pt)", "#fbbf24");
        setStatus("Select a tile, place it, click to rotate, then click CONFIRM.");
        updateUI();
        triggerCellClass(r, c, "fx-trap-lock", 520);
      }
      return;
    }
    if (activeItem === "bomb") {
      if (!itemUsed[1].bomb && board[r][c] && board[r][c].tile) {
        stopCpuBackgroundPrecompute();
        var prevSigBomb = getBoardSignatureForCpu();
        var prevDiffBomb = cpuDifficulty;
        var prevTurn2Bomb = turnCount[2];
        var costBomb = ITEM_COSTS.bomb;
        itemUsed[1].bomb = true;
        scores[1] -= costBomb; board[r][c] = null; activeItem = null;
        var newSigBomb = getBoardSignatureForCpu();
        carryOverUnaffectedCandidates(prevSigBomb, prevDiffBomb, prevTurn2Bomb, newSigBomb, [[r, c]]);
        playSeDestroyBlast();
        addLog("P1: DESTROY (-" + costBomb + " pt)", "#fbbf24");
        setStatus("Select a tile, place it, click to rotate, then click CONFIRM.");
        updateUI();
        spawnDestroyBlast(r, c);
        scheduleCpuBackgroundPrecompute();
      }
      return;
    }

    var handTile = hands[1][selectedHandIdx];
    var moves = getValidMoves(handTile, 1);
    for (var i = 0; i < moves.length; i++) {
      if (moves[i].r === r && moves[i].c === c) {
        stopCpuBackgroundPrecompute();
        if (rotDraft) {
          rotDraft.committed = true;
          activeItem = null;
        }
        playerInteractedThisTurn = true;
        draftMove = {
          r: r,
          c: c,
          handIdx: selectedHandIdx,
          penalty: moves[i].penalty,
          tile: {
            num: handTile.num,
            owner: handTile.owner,
            wild: !!handTile.wild,
            legs: handTile.legs.slice()
          }
        };
        playSeSelect();
        setStatus(rotDraft
          ? "Click placed tile to rotate, or click CONFIRM to confirm both rotation & placement."
          : "Click placed tile to rotate 90°, or click CONFIRM to end turn.");
        updateUI();
        break;
      }
    }
  }

  var origFinalizeMove = finalizeMove;
  finalizeMove = function(r, c, handIdx, tile, player, isPenalty) {
    var prevBoardSig = getBoardSignatureForCpu();
    var prevDiff = cpuDifficulty;
    var prevTurn2 = turnCount[2];
    var changedCoords = [[r, c]];
    if (turnRotatedPos && turnRotatedPos.coord && turnRotatedPos.coord.length === 2) {
      changedCoords.push([turnRotatedPos.coord[0], turnRotatedPos.coord[1]]);
    }

    origFinalizeMove(r, c, handIdx, tile, player, isPenalty);

    if (player === 1 && !gameOver && stageConfirmed) {
      var newBoardSig = getBoardSignatureForCpu();
      carryOverUnaffectedCandidates(prevBoardSig, prevDiff, prevTurn2, newBoardSig, changedCoords);
    }
  };

  function createTileElement(tile) {
    var el = document.createElement("div");
    el.className = "tile owner-" + tile.owner + (tile.wild ? " wild-card" : "");
    el.textContent = tile.wild ? "\u2600" : tile.num;
    var legClasses = ["top", "right", "bottom", "left"];
    for (var i = 0; i < 4; i++) {
      if (tile.legs[i]) {
        var leg = document.createElement("div");
        leg.className = "leg " + legClasses[i];
        el.appendChild(leg);
      }
    }
    return el;
  }

  function updateUI() {
    document.getElementById("score1").textContent = scores[1];
    document.getElementById("score2").textContent = scores[2];

    if (!stageConfirmed) {
      document.getElementById("turnInfo").textContent = "Stage Ready";
    } else {
      document.getElementById("turnInfo").textContent = turnCount[1] === 0 ? "Turn 1 (Place Anywhere)" : "Turn " + (turnCount[1] + 1);
    }

    var hasDraft = (draftMove !== null || rotDraft !== null);
    var canSelectHandOrCell = stageConfirmed && !gameOver && turnPlayer === 1 && (draftMove === null);
    var canAct = stageConfirmed && !gameOver && turnPlayer === 1 && !hasDraft;
    document.getElementById("btnConfirm").disabled = !((!stageConfirmed) || (!gameOver && turnPlayer === 1 && hasDraft));
    document.getElementById("btnUndo").disabled = !(stageConfirmed && !gameOver && turnPlayer === 1 && hasDraft);

    var keys = ["rot", "shf", "trap", "bomb"];
    var validTrapList = canAct ? getValidTrapCells() : [];
    var trapTargetSet = {};
    for (var vt = 0; vt < validTrapList.length; vt++) {
      trapTargetSet[validTrapList[vt][0] + "," + validTrapList[vt][1]] = true;
    }
    var boardTileCount = canAct ? getBoardTiles().length : 0;

    for (var k = 0; k < keys.length; k++) {
      var key = keys[k];
      var btn = document.getElementById("item-" + key);
      var costEl = document.getElementById("cost-" + key);
      var costVal = ITEM_COSTS[key];
      var used = itemUsed[1][key];
      if (costEl) {
        costEl.textContent = used ? "USED" : (costVal + " pt");
      }
      if (key === "trap") {
        btn.disabled = !canAct || used || scores[1] < costVal || validTrapList.length === 0;
      } else if (key === "rot" || key === "bomb") {
        btn.disabled = !canAct || used || scores[1] < costVal || boardTileCount === 0;
      } else {
        btn.disabled = !canAct || used || scores[1] < costVal;
      }
      if (activeItem === key) btn.classList.add("active"); else btn.classList.remove("active");
    }

    var handList = document.getElementById("handList");
    handList.innerHTML = "";
    for (var idx = 0; idx < hands[1].length; idx++) {
      (function(i) {
        var slot = document.createElement("div");
        slot.className = "hand-slot" + (i === selectedHandIdx ? " selected" : "");
        slot.onclick = function() {
          if (canSelectHandOrCell) {
            selectedHandIdx = i;
            activeItem = null;
            playerInteractedThisTurn = true;
            playSeSelect();
            updateUI();
          }
        };
        slot.appendChild(createTileElement(hands[1][i]));
        handList.appendChild(slot);
      })(idx);
    }

    var hasCpuActionRecord = !!(cpuLastActions && (cpuLastActions.place || cpuLastActions.rotate || cpuLastActions.destroy));
    var overlayEl = document.getElementById("gameOverOverlay");
    var isViewingBoardAfterLoss = gameOver && (scores[2] > scores[1]) && (!overlayEl || !overlayEl.classList.contains("show"));
    var showCpuActionGuide = stageConfirmed && hasCpuActionRecord && (
      (!gameOver && turnPlayer === 1 && !playerInteractedThisTurn && !activeItem && !draftMove && !rotDraft) ||
      isViewingBoardAfterLoss
    );

    var validMap = {};
    if (!showCpuActionGuide && canSelectHandOrCell && (!activeItem || activeItem === "rot")) {
      var moves = getValidMoves(hands[1][selectedHandIdx], 1);
      for (var m = 0; m < moves.length; m++) {
        validMap[moves[m].r + "," + moves[m].c] = moves[m].penalty;
      }
    }

    var glowSet = {};
    for (var g = 0; g < glowCells.length; g++) {
      glowSet[glowCells[g][0] + "," + glowCells[g][1]] = true;
    }

    var boardEl = document.getElementById("board");
    boardEl.style.gridTemplateColumns = "repeat(" + COLS + ", var(--cell-size))";
    boardEl.innerHTML = "";
    syncBoardPersistentState();

    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        (function(rr, cc) {
          var cell = document.createElement("div");
          cell.className = "cell";
          var data = board[rr][cc];
          var isDraftHere = draftMove && draftMove.r === rr && draftMove.c === cc;
          var posKey = rr + "," + cc;

          if (data && data.wall) {
            cell.classList.add("wall");
          } else {
            if (minusMap[rr][cc]) {
              cell.classList.add("minus-cell");
              var disk = document.createElement("span"); disk.className = "bh-disk";
              var core = document.createElement("span"); core.className = "bh-core";
              cell.appendChild(disk); cell.appendChild(core);
            }
            if (luckyMap[rr][cc]) cell.classList.add("lucky");
            if (rouletteMap[rr][cc]) cell.classList.add("roulette-cell");
            if (trapMap[rr][cc] === 1 && (!data || !data.tile) && !isDraftHere) {
              cell.classList.add("trap-p1");
              var badge = document.createElement("span");
              badge.className = "trap-badge";
              cell.appendChild(badge);
            }
            if (posKey in glowSet) cell.classList.add("score-glow");

            var isCpuPlaceHere = showCpuActionGuide && cpuLastActions.place && cpuLastActions.place[0] === rr && cpuLastActions.place[1] === cc;
            var isCpuRotateHere = showCpuActionGuide && cpuLastActions.rotate && cpuLastActions.rotate[0] === rr && cpuLastActions.rotate[1] === cc;
            var isCpuDestroyHere = showCpuActionGuide && cpuLastActions.destroy && cpuLastActions.destroy[0] === rr && cpuLastActions.destroy[1] === cc;
            var isCpuActionHere = isCpuPlaceHere || isCpuRotateHere || isCpuDestroyHere;

            var isRotDraftHere = rotDraft && rotDraft.r === rr && rotDraft.c === cc;
            if (isDraftHere) {
              cell.classList.add("draft-cell");
              cell.appendChild(createTileElement(draftMove.tile));
            } else if (data && data.tile) {
              if (isRotDraftHere) cell.classList.add("draft-cell");
              if (isCpuActionHere) cell.classList.add("cpu-guide");
              cell.appendChild(createTileElement(data.tile));
              if (!isCpuActionHere && lastPlacedPos && lastPlacedPos[0] === rr && lastPlacedPos[1] === cc) cell.classList.add("last-placed");
              if (canAct && (activeItem === "bomb" || activeItem === "rot")) cell.classList.add("targetable");
            } else {
              if (isCpuActionHere) cell.classList.add("cpu-guide");
              if (canAct && activeItem === "trap" && (posKey in trapTargetSet)) {
                cell.classList.add("targetable");
              } else if (posKey in validMap) {
                cell.classList.add(validMap[posKey] ? "penalty-drop" : "valid-drop");
              }
            }
            cell.onclick = function() { onCellClick(rr, cc); };
          }
          boardEl.appendChild(cell);
        })(r, c);
      }
    }
  }

  function prepareStageSelection() {
    try {
      stopCpuBackgroundPrecompute();
      resetAllCpuCaches();
      hideGameOverOverlay();
      var newBtnInit = document.getElementById("btnNew");
      if (newBtnInit) newBtnInit.classList.remove("rematch-pulse");
      applyCpuDifficultyClass();
      applyViewModeClass();
      applyMoonOptionClass();
      scores = { 1: 0, 2: 0 };
      turnCount = { 1: 0, 2: 0 };
      turnPlayer = 1;
      stageConfirmed = false;
      matchStartEffectPlayed = false;
      selectedHandIdx = 0;
      activeItem = null;
      draftMove = null;
      rotDraft = null;
      turnRotatedPos = null;
      glowCells = [];
      gameOver = false;
      lastPlacedPos = null;
      itemUsed = {
        1: { rot: false, shf: false, trap: false, bomb: false },
        2: { rot: false, shf: false, trap: false, bomb: false }
      };
      cpuKnowsP1Trap = false;
      cpuLastActions = { place: null, rotate: null, destroy: null };
      cpuUsedTrapLastTurn = false;
      playerInteractedThisTurn = false;
      document.getElementById("logBox").innerHTML = "";
      generateStage();
      hands[1] = [createRandomTile(1), createRandomTile(1), createRandomTile(1), createRandomTile(1)];
      hands[2] = [createRandomTile(2), createRandomTile(2), createRandomTile(2), createRandomTile(2)];
      addLog("STAGE READY (" + COLS + "x" + ROWS + ")" + (moonRouletteAll ? " [MOON ALL]" : "") + " - CONFIRM", "#38bdf8");
      setStatus("Check or re-pick stage, then press CONFIRM to draw First/Second (50/50).");
      updateUI();
    } catch (e) {
      showError(e.message);
    }
  }

  document.getElementById("btnCpuDiff").onclick = cycleCpuDifficulty;
  document.getElementById("btnMoonAll").onclick = toggleMoonRouletteAll;
  document.getElementById("btnViewMode").onclick = toggleViewMode;
  document.getElementById("btnBgm").onclick = toggleBgm;
  document.getElementById("btnNew").onclick = function() {
    playSeSelect();
    prepareStageSelection();
  };
  document.getElementById("goalSelect").onchange = function() {
    playSeSelect();
  };
  document.getElementById("btnConfirm").onclick = confirmDraftMove;
  document.getElementById("btnUndo").onclick = cancelDraftMove;
  document.getElementById("item-rot").onclick = function() { selectItem("rot"); };
  document.getElementById("item-shf").onclick = function() { selectItem("shf"); };
  document.getElementById("item-trap").onclick = function() { selectItem("trap"); };
  document.getElementById("item-bomb").onclick = function() { selectItem("bomb"); };
  document.getElementById("goPlayAgainBtn").onclick = function() {
    playSeSelect();
    prepareStageSelection();
  };
  document.getElementById("goCloseBtn").onclick = function() {
    playSeSelect();
    hideGameOverOverlay();
    updateUI();
  };

  prepareStageSelection();
})();
</script>
</body>
</html>
